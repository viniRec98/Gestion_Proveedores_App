<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Editar proveedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Editar proveedor</h3>
      <a href="{{ url_for('provider.list_providers') }}" class="btn btn-outline-secondary">Volver</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{cat}}">{{msg}}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card p-3">
      <form method="post" class="row g-2">
        <div class="col-md-6"><input name="company_name" value="{{ provider.company_name }}" class="form-control" placeholder="Nombre de la empresa" required></div>
        <div class="col-md-6"><input name="contact_person" value="{{ provider.contact_person }}" class="form-control" placeholder="Persona de contacto"></div>
        <div class="col-md-4"><input name="email" value="{{ provider.email }}" class="form-control" placeholder="Correo"></div>
        <div class="col-md-2">
          <select name="type" class="form-select">
            {% for opt in ['insumos','transporte','maquinaria','otro'] %}
              <option value="{{ opt }}" {% if provider.type == opt %}selected{% endif %}>{{ opt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2"><input name="nit" value="{{ provider.nit }}" class="form-control" placeholder="NIT/RTU"></div>
        <div class="col-md-2"><input name="phone" value="{{ provider.phone }}" class="form-control" placeholder="Teléfono"></div>
        <div class="col-md-2"><input name="city" value="{{ provider.city }}" class="form-control" placeholder="Ciudad"></div>
        <div class="col-12"><button class="btn btn-success mt-2">Guardar cambios</button></div>
      </form>
    </div>
  </div>
</body>
</html>
